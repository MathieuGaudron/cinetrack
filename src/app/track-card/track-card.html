<article
  class="card"
  [class.active]="active()"
  [appHighlightFavorite]="track().favorite"
  (click)="select.emit(track())">
  <img [src]="track().coverUrl" [alt]="track().title" />
  <h3>{{ track().title }}</h3>
  <p>{{ track().artist }}</p>
  <p class="duration">{{ track().durationSeconds | durationFormat }}</p>

  @switch (true) {
    @case (track().rating >= 9) {
      <span class="badge gold">⭐ Coup de cœur</span>
    }
    @case (track().rating >= 7) {
      <span class="badge">👍 Recommandé</span>
    }
    @default {
      <span class="badge muted">À découvrir</span>
    }
  }

  @if (active()) {
    <span class="badge">▶ En lecture</span>
  }

  <a
    class="detail-link"
    [routerLink]="['/tracks', track().id]"
    (click)="$event.stopPropagation()">
    Voir la fiche →
  </a>

  @if (canDelete()) {
    <button
      type="button"
      class="delete"
      (click)="$event.stopPropagation(); remove.emit(track().id)">
      🗑 Supprimer
    </button>
  }
</article>
