<section class="grid">
  @for (track of tracks(); track track.id) {
    <app-track-card
      [track]="track"
      [active]="track.id === selectedId()"
      [canDelete]="canDelete()"
      (select)="selectedId.set($event.id)"
      (remove)="remove.emit($event)" />
  } @empty {
    @if (searchTerm().trim() !== '') {
      <p>Aucun résultat pour « {{ searchTerm() }} ».</p>
    } @else {
      <p>Aucun morceau.</p>
    }
  }
</section>
